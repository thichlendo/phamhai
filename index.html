<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>TrueDepth 3D Face Scanner — HD</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #050508;
      color: #e0e0e0;
      font-family: 'Courier New', monospace;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    #container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #videoElement {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      opacity: 0; /* hidden — we draw to WebGL canvas instead */
    }

    /* WebGL canvas for the dot projector */
    #glCanvas {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0; left: 0;
      z-index: 2;
    }

    /* 2D HUD overlay canvas */
    #hudCanvas {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0; left: 0;
      z-index: 3;
      pointer-events: none;
    }

    /* HUD overlay */
    #hud {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 10;
    }

    .corner {
      position: absolute;
      width: 30px; height: 30px;
      border-color: #00ffe7;
      border-style: solid;
      opacity: 0.7;
    }
    .corner-tl { top: 12px; left: 12px; border-width: 2px 0 0 2px; }
    .corner-tr { top: 12px; right: 12px; border-width: 2px 2px 0 0; }
    .corner-bl { bottom: 12px; left: 12px; border-width: 0 0 2px 2px; }
    .corner-br { bottom: 12px; right: 12px; border-width: 0 2px 2px 0; }

    /* ── Status Bar ── */
    #statusBar {
      position: absolute;
      top: 0; left: 0; right: 0;
      z-index: 100;
      padding: 10px 16px;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: none;
      transition: opacity 0.4s;
    }
    #statusBar.hidden { opacity: 0; pointer-events: none; }

    #statusDot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #ffcc00;
      flex-shrink: 0;
      animation: pulse 1s ease-in-out infinite;
    }
    #statusDot.ok { background: #00ff88; animation: none; }
    #statusDot.error { background: #ff3c3c; animation: none; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    #statusBarText {
      font-size: 11px;
      letter-spacing: 1px;
      color: #fff;
      text-transform: uppercase;
      flex: 1;
    }

    /* ── Error overlay ── */
    #errorOverlay {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 500;
      background: rgba(10,10,15,0.92);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px;
      gap: 16px;
      text-align: center;
    }
    #errorOverlay.visible { display: flex; }
    #errorTitle {
      font-size: 18px;
      color: #ff3c3c;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    #errorDetail {
      font-size: 13px;
      color: #ffaaaa;
      line-height: 1.6;
      max-width: 420px;
      word-break: break-word;
    }
    #retryBtn {
      margin-top: 10px;
      background: rgba(255,60,60,0.15);
      border: 1.5px solid #ff3c3c;
      color: #ff3c3c;
      border-radius: 50px;
      padding: 10px 28px;
      font-size: 13px;
      letter-spacing: 2px;
      cursor: pointer;
      text-transform: uppercase;
      pointer-events: all;
    }
    #retryBtn:active { transform: scale(0.95); }

    /* ── Stats HUD ── */
    #stats {
      position: absolute;
      top: 56px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      pointer-events: none;
      z-index: 15;
    }

    .stat-box {
      background: rgba(0,0,0,0.65);
      border: 1px solid rgba(0,255,231,0.4);
      border-radius: 6px;
      padding: 5px 12px;
      text-align: center;
      backdrop-filter: blur(4px);
    }

    .stat-label {
      font-size: 8px;
      letter-spacing: 2px;
      color: #00ffe7;
      text-transform: uppercase;
      opacity: 0.8;
    }

    .stat-value {
      font-size: 18px;
      font-weight: bold;
      color: #ffffff;
      line-height: 1.1;
    }

    .stat-value.fps { color: #00ff88; }
    .stat-value.res { color: #c084fc; font-size: 13px; }
    .stat-value.pts { color: #00e5ff; }

    #scanLine {
      position: absolute;
      left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, #00ffe7, #00e5ff, transparent);
      box-shadow: 0 0 20px 4px rgba(0,229,255,0.6);
      opacity: 0;
      pointer-events: none;
      z-index: 20;
      transition: opacity 0.1s;
    }

    #bottomBar {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(transparent, rgba(0,0,0,0.7));
      z-index: 15;
    }

    #statusMsg {
      font-size: 11px;
      letter-spacing: 1px;
      color: rgba(0,255,231,0.7);
      text-transform: uppercase;
    }

    #switchCamBtn {
      pointer-events: all;
      background: rgba(0,0,0,0.5);
      border: 1.5px solid rgba(0,255,231,0.5);
      color: #00ffe7;
      border-radius: 50px;
      padding: 8px 18px;
      font-size: 12px;
      letter-spacing: 1px;
      cursor: pointer;
      backdrop-filter: blur(4px);
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 7px;
    }
    #switchCamBtn:hover { background: rgba(0,255,231,0.15); border-color: #00ffe7; }
    #switchCamBtn:active { transform: scale(0.95); }
    #switchCamBtn svg { width: 16px; height: 16px; fill: #00ffe7; }

    #trackerList {
      position: absolute;
      top: 136px;
      right: 14px;
      width: 140px;
      pointer-events: none;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .tracker-entry {
      background: rgba(0,0,0,0.55);
      border-left: 3px solid;
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 10px;
      letter-spacing: 1px;
      backdrop-filter: blur(3px);
      animation: fadeIn 0.3s ease;
    }

    .tracker-entry.known { border-color: #00ffe7; color: #00ffe7; }
    .tracker-entry.new   { border-color: #ffcc00; color: #ffcc00; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateX(20px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    /* ── Loading overlay ── */
    #loadingOverlay {
      position: absolute;
      inset: 0;
      background: #050508;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      z-index: 999;
      transition: opacity 0.5s;
    }
    #loadingOverlay.hidden { opacity: 0; pointer-events: none; }

    .spinner {
      width: 50px; height: 50px;
      border: 3px solid rgba(0,255,231,0.2);
      border-top-color: #00ffe7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text {
      color: #00ffe7;
      font-size: 13px;
      letter-spacing: 3px;
      text-transform: uppercase;
      opacity: 0.8;
    }
    #loadingStep {
      color: #aaa;
      font-size: 11px;
      letter-spacing: 1px;
      max-width: 300px;
      text-align: center;
    }
  </style>
</head>
<body>

  <video id="videoElement" autoplay playsinline muted></video>

  <!-- HUD corner decorations -->

      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M20 5h-3.17L15 3H9L7.17 5H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm-8 13c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
      </svg>
      Đổi camera
    </button>

</div>

<!--
  MediaPipe CDN:
  1. camera_utils
  2. drawing_utils (for FACEMESH_TESSELATION constants)
  3. face_mesh
-->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

<script>
'use strict';

// ═══════════════════════════════════════════════════════════════════════════════
// GLOBAL ERROR HANDLER
// ═══════════════════════════════════════════════════════════════════════════════
window.onerror = function(message, source, lineno, colno, error) {
  showError('Lỗi JavaScript',
    `${message}\n(${source ? source.split('/').pop() : 'unknown'}:${lineno}:${colno})`);
  return true;
};

window.onunhandledrejection = function(event) {
  showError('Lỗi Promise không được xử lý', String(event.reason));
};

// ═══════════════════════════════════════════════════════════════════════════════
// DOM REFS
// ═══════════════════════════════════════════════════════════════════════════════
const video            = document.getElementById('videoElement');
const glCanvas         = document.getElementById('glCanvas');
const hudCanvas        = document.getElementById('hudCanvas');
const hudCtx           = hudCanvas.getContext('2d');
const scanLine         = document.getElementById('scanLine');
const statusMsg        = document.getElementById('statusMsg');
const currentCountEl   = document.getElementById('currentCount');
const totalCountEl     = document.getElementById('totalCount');
const fpsEl            = document.getElementById('fpsDisplay');
const resEl            = document.getElementById('resDisplay');
const pointCountEl     = document.getElementById('pointCount');
const trackerListEl    = document.getElementById('trackerList');
const loadingOverlay   = document.getElementById('loadingOverlay');
const loadingStepEl    = document.getElementById('loadingStep');
const switchCamBtn     = document.getElementById('switchCamBtn');
const statusBar        = document.getElementById('statusBar');
const statusDot        = document.getElementById('statusDot');
const statusBarText    = document.getElementById('statusBarText');
const errorOverlay     = document.getElementById('errorOverlay');
const errorDetailEl    = document.getElementById('errorDetail');
const retryBtn         = document.getElementById('retryBtn');

// ═══════════════════════════════════════════════════════════════════════════════
// WEBGL SETUP — DOT PROJECTOR RENDERER
// ═══════════════════════════════════════════════════════════════════════════════
const gl = glCanvas.getContext('webgl', { alpha: true, antialias: false, premultipliedAlpha: false });
if (!gl) { alert('WebGL not supported'); }

// ── Vertex Shader: renders gl.POINTS with depth-based size & brightness ──
const VERT_SRC = `
  attribute vec3 aPosition;   // x, y in normalized [0,1] coords; z = depth
  uniform vec2 uResolution;   // canvas pixel size
  uniform float uPointScale;  // base point size multiplier
  uniform float uScanY;       // scanline Y position [0..1], -1 = off
  uniform float uTime;        // animation time
  varying float vBrightness;
  varying float vScanDist;
  varying float vDepth;

  void main() {
    // Map from [0,1] to clip space [-1,1], flip Y
    float cx = aPosition.x * 2.0 - 1.0;
    float cy = 1.0 - aPosition.y * 2.0;
    gl_Position = vec4(cx, cy, 0.0, 1.0);

    // Depth: z ~ 0 = far, z ~ 1 = near (nose tip closer)
    // MediaPipe z is negative for closer points, positive for farther
    float depthNorm = clamp(-aPosition.z * 8.0 + 0.5, 0.0, 1.0);
    vDepth = depthNorm;

    // Point size: larger for closer points (depth-based parallax)
    float baseSize = uPointScale * (0.6 + depthNorm * 1.8);
    gl_PointSize = clamp(baseSize, 1.0, 8.0);

    // Brightness: closer = brighter, farther = dimmer
    vBrightness = 0.3 + depthNorm * 0.7;

    // Scanline proximity boost
    float dy = abs(aPosition.y - uScanY);
    vScanDist = smoothstep(0.08, 0.0, dy);
  }
`;

// ── Fragment Shader: glowing cyan/violet dot with scanline highlight ──
const FRAG_SRC = `
  precision mediump float;
  varying float vBrightness;
  varying float vScanDist;
  varying float vDepth;
  uniform float uTime;
  uniform float uColorMode; // 0 = cyan, 1 = violet/IR

  void main() {
    // Circular point with soft glow edge
    float dist = length(gl_PointCoord - vec2(0.5));
    if (dist > 0.5) discard;
    float glow = 1.0 - smoothstep(0.0, 0.5, dist);
    glow = glow * glow; // quadratic falloff for sharper dots

    // Base color: cyan neon or IR violet
    vec3 colorCyan   = vec3(0.0, 0.9, 0.88);
    vec3 colorViolet = vec3(0.6, 0.2, 1.0);
    vec3 baseColor = mix(colorCyan, colorViolet, uColorMode);

    // Scanline: boost brightness + add white flash
    float scanBoost = vScanDist * 2.0;
    vec3 scanColor  = mix(baseColor, vec3(1.0), vScanDist * 0.6);

    float alpha = glow * (vBrightness + scanBoost) * 0.95;
    vec3 finalColor = scanColor * (vBrightness + scanBoost);

    gl_FragColor = vec4(finalColor, alpha);
  }
`;

function compileShader(src, type) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    console.error('Shader compile error:', gl.getShaderInfoLog(s));
    return null;
  }
  return s;
}

const vertShader = compileShader(VERT_SRC, gl.VERTEX_SHADER);
const fragShader = compileShader(FRAG_SRC, gl.FRAGMENT_SHADER);
const program = gl.createProgram();
gl.attachShader(program, vertShader);
gl.attachShader(program, fragShader);
gl.linkProgram(program);
if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
  console.error('Program link error:', gl.getProgramInfoLog(program));
}
gl.useProgram(program);

const aPosition    = gl.getAttribLocation(program, 'aPosition');
const uResolution  = gl.getUniformLocation(program, 'uResolution');
const uPointScale  = gl.getUniformLocation(program, 'uPointScale');
const uScanY       = gl.getUniformLocation(program, 'uScanY');
const uTime        = gl.getUniformLocation(program, 'uTime');
const uColorMode   = gl.getUniformLocation(program, 'uColorMode');

const pointBuffer  = gl.createBuffer();
gl.enableVertexAttribArray(aPosition);

gl.enable(gl.BLEND);
gl.blendFunc(gl.SRC_ALPHA, gl.ONE); // additive blending for glow

// ═══════════════════════════════════════════════════════════════════════════════
// STATUS / ERROR HELPERS
// ═══════════════════════════════════════════════════════════════════════════════
function setStatus(text, state = 'loading') {
  statusBarText.textContent = text;
  statusDot.className = state === 'ok' ? 'ok' : state === 'error' ? 'error' : '';
}

function hideStatusBar() { statusBar.classList.add('hidden'); }

function showError(title, detail) {
  loadingOverlay.classList.add('hidden');
  document.getElementById('errorTitle').textContent = '⚠ ' + title;
  errorDetailEl.textContent = detail;
  errorOverlay.classList.add('visible');
  setStatus('Lỗi: ' + title, 'error');
  console.error('[FaceDetector]', title, detail);
}

function hideError() { errorOverlay.classList.remove('visible'); }

// ═══════════════════════════════════════════════════════════════════════════════
// AUDIO BEEP
// ═══════════════════════════════════════════════════════════════════════════════
let audioCtx = null;

function getAudioCtx() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
  return audioCtx;
}

function playBeep(freq = 880, dur = 0.12, vol = 0.3) {
  try {
    const ctx = getAudioCtx();
    if (!ctx) return;
    if (ctx.state === 'suspended') ctx.resume();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.setValueAtTime(freq, ctx.currentTime);
    osc.type = 'sine';
    gain.gain.setValueAtTime(vol, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + dur);
  } catch(e) {}
}

// ═══════════════════════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════════════════════
let useFrontCamera    = true;
let currentStream     = null;
let mediapipeCamera   = null;
let faceMesh          = null;

let nextTrackerId  = 1;
let totalDetected  = 0;
let trackers       = []; // { id, color, isNew, descriptor }

let scanAnimActive = false;

// FPS counters
let frameCount = 0;
let fpsTimer   = performance.now();
let currentFPS = 0;

// Current active point count displayed
let activePointCount = 0;

// Mesh constants
let TESSELATION = [];

// Colors
const COLOR_KNOWN = '#00ffe7';
const COLOR_NEW   = '#ffcc00';

// ═══════════════════════════════════════════════════════════════════════════════
// FACE DESCRIPTOR — Geometric ratio vector for Re-ID
// ═══════════════════════════════════════════════════════════════════════════════
// Extract a rotation/scale-invariant face signature from key landmark ratios
const FACE_SIG_INDICES = {
  noseTip: 1, noseRoot: 6, chin: 152, foreHead: 10,
  leftEyeInner: 133, leftEyeOuter: 33,
  rightEyeInner: 362, rightEyeOuter: 263,
  mouthLeft: 61, mouthRight: 291, mouthTop: 13, mouthBottom: 14,
  leftCheek: 234, rightCheek: 454,
  leftEar: 127, rightEar: 356,
};

function euclidean3(a, b) {
  const dx = a.x - b.x, dy = a.y - b.y, dz = (a.z || 0) - (b.z || 0);
  return Math.sqrt(dx * dx + dy * dy + dz * dz);
}

function extractFaceDescriptor(lm) {
  const P = {};
  for (const [name, idx] of Object.entries(FACE_SIG_INDICES)) {
    P[name] = lm[idx];
  }

  // Reference distance for normalization (inter-eye distance)
  const interEye = euclidean3(P.leftEyeOuter, P.rightEyeOuter);
  if (interEye < 0.001) return null;

  // Build geometric ratio vector (16 ratios)
  const ratios = [
    euclidean3(P.noseTip, P.chin) / interEye,
    euclidean3(P.noseTip, P.foreHead) / interEye,
    euclidean3(P.noseTip, P.noseRoot) / interEye,
    euclidean3(P.leftEyeInner, P.rightEyeInner) / interEye,
    euclidean3(P.mouthLeft, P.mouthRight) / interEye,
    euclidean3(P.mouthTop, P.mouthBottom) / interEye,
    euclidean3(P.noseTip, P.mouthTop) / interEye,
    euclidean3(P.leftCheek, P.rightCheek) / interEye,
    euclidean3(P.leftEyeOuter, P.leftCheek) / interEye,
    euclidean3(P.rightEyeOuter, P.rightCheek) / interEye,
    euclidean3(P.foreHead, P.chin) / interEye,
    euclidean3(P.leftEar, P.rightEar) / interEye,
    euclidean3(P.noseTip, P.leftEyeOuter) / interEye,
    euclidean3(P.noseTip, P.rightEyeOuter) / interEye,
    euclidean3(P.chin, P.mouthBottom) / interEye,
    euclidean3(P.noseRoot, P.foreHead) / interEye,
  ];
  return ratios;
}

function descriptorDistance(a, b) {
  if (!a || !b || a.length !== b.length) return Infinity;
  let sum = 0;
  for (let i = 0; i < a.length; i++) {
    const d = a[i] - b[i];
    sum += d * d;
  }
  return Math.sqrt(sum);
}

const RE_ID_THRESHOLD = 0.55; // below this = same person
let knownFaces = []; // { id, descriptor, lastSeen, color }

// ═══════════════════════════════════════════════════════════════════════════════
// BARYCENTRIC INTERPOLATION — Dense Point Cloud Generator
// ═══════════════════════════════════════════════════════════════════════════════
// Uses FACEMESH_TESSELATION triangles to generate dense sub-points
// via barycentric interpolation on the 3D surface.

const SUBDIV_LEVEL = 4; // subdivisions per triangle edge → ~16 points per triangle

// Pre-compute barycentric sample coordinates once
const barycentricSamples = [];
(function precomputeBarycentric() {
  const N = SUBDIV_LEVEL;
  for (let i = 0; i <= N; i++) {
    for (let j = 0; j <= N - i; j++) {
      const k = N - i - j;
      const u = i / N;
      const v = j / N;
      const w = k / N;
      barycentricSamples.push([u, v, w]);
    }
  }
})();

function generateDensePoints(landmarks, triangles) {
  // Pre-allocate Float32Array (3 floats per point: x, y, z)
  const maxPoints = triangles.length * barycentricSamples.length;
  const data = new Float32Array(maxPoints * 3);
  let count = 0;

  for (let t = 0; t < triangles.length; t++) {
    const [ia, ib] = triangles[t]; // pair from FACEMESH_TESSELATION
    // TESSELATION is a flat list of [a,b] pairs forming edge list;
    // We need to form triangles. We'll skip and use the raw tessellation edges
    // to sample along each edge + interpolated points.
    // Actually FACEMESH_TESSELATION is already triangle pair edges.
    // We'll sample directly from landmarks and interpolate within each triangle.
  }

  // Better approach: use every 3 consecutive pairs to form triangles
  // from the raw tessellation data. MediaPipe FACEMESH_TESSELATION has
  // individual edge pairs. Instead, let's generate dense points by
  // sampling across the entire face mesh using a triangle index list.
  return generateDensePointsFromTriangles(landmarks);
}

// Build proper triangle indices from tessellation edge pairs
function buildTriangleIndices(tessEdges) {
  // MediaPipe FACEMESH_TESSELATION is a list of [a,b] edges that form triangles.
  // Each triangle has 3 edges: [a,b], [b,c], [c,a]
  // We need to reconstruct triangles from this edge list.
  // Shortcut: use a known triangle list for the 468-point face mesh.
  // We can derive triangles by grouping every 3 edges.

  // Alternative: Build adjacency and extract triangles.
  // For performance, we'll build an edge set and find all cliques of size 3.
  const edgeSet = new Set();
  const adj = new Map();

  for (const [a, b] of tessEdges) {
    const key = a < b ? `${a}_${b}` : `${b}_${a}`;
    edgeSet.add(key);
    if (!adj.has(a)) adj.set(a, []);
    if (!adj.has(b)) adj.set(b, []);
    adj.get(a).push(b);
    adj.get(b).push(a);
  }

  const triangles = [];
  const seen = new Set();

  for (const [a, b] of tessEdges) {
    const neighborsA = adj.get(a) || [];
    const neighborsB = adj.get(b) || [];

    // Find common neighbors of a and b
    const setB = new Set(neighborsB);
    for (const c of neighborsA) {
      if (c !== b && setB.has(c)) {
        const tri = [a, b, c].sort((x, y) => x - y);
        const triKey = tri.join('_');
        if (!seen.has(triKey)) {
          seen.add(triKey);
          triangles.push(tri);
        }
      }
    }
  }

  return triangles;
}

let cachedTriangles = null;

function generateDensePointsFromTriangles(landmarks) {
  if (!cachedTriangles && TESSELATION.length > 0) {
    cachedTriangles = buildTriangleIndices(TESSELATION);
  }

  if (!cachedTriangles || cachedTriangles.length === 0) {
    // Fallback: just use the 468 landmarks directly
    const data = new Float32Array(landmarks.length * 3);
    for (let i = 0; i < landmarks.length; i++) {
      data[i * 3]     = landmarks[i].x;
      data[i * 3 + 1] = landmarks[i].y;
      data[i * 3 + 2] = landmarks[i].z || 0;
    }
    return { data, count: landmarks.length };
  }

  const maxPts = cachedTriangles.length * barycentricSamples.length;
  const data = new Float32Array(maxPts * 3);
  let count = 0;

  for (const [ia, ib, ic] of cachedTriangles) {
    const A = landmarks[ia], B = landmarks[ib], C = landmarks[ic];
    if (!A || !B || !C) continue;

    for (const [u, v, w] of barycentricSamples) {
      const px = A.x * u + B.x * v + C.x * w;
      const py = A.y * u + B.y * v + C.y * w;
      const pz = (A.z || 0) * u + (B.z || 0) * v + (C.z || 0) * w;
      data[count * 3]     = px;
      data[count * 3 + 1] = py;
      data[count * 3 + 2] = pz;
      count++;
    }
  }

  return { data, count };
}

// ═══════════════════════════════════════════════════════════════════════════════
// INTERPOLATION / LERP — Smooth landmark transitions between frames
// ═══════════════════════════════════════════════════════════════════════════════
const LERP_FACTOR = 0.45; // 0 = no smoothing, 1 = no interpolation

let prevLandmarksSmoothed = []; // per-face array of smoothed landmarks

function lerpLandmarks(current, previous) {
  if (!previous || previous.length !== current.length) return current;
  return current.map((lm, i) => {
    const prev = previous[i];
    if (!prev) return lm;
    return {
      x: prev.x + (lm.x - prev.x) * LERP_FACTOR,
      y: prev.y + (lm.y - prev.y) * LERP_FACTOR,
      z: (prev.z || 0) + ((lm.z || 0) - (prev.z || 0)) * LERP_FACTOR,
    };
  });
}

// ═══════════════════════════════════════════════════════════════════════════════
// SCANLINE ANIMATION STATE
// ═══════════════════════════════════════════════════════════════════════════════
let scanlineY = 0; // normalized [0..1]
let scanlineActive = true; // continuous radar scan

function updateScanline() {
  const speed = 0.008; // normalized units per frame
  scanlineY += speed;
  if (scanlineY > 1.15) scanlineY = -0.15;
}

// Scan animation overlay (CSS scan line for new face detection)
function triggerScanAnimation() {
  if (scanAnimActive) return;
  scanAnimActive = true;
  scanLine.style.opacity = '1';
  let y = 0, dir = 1, passes = 0;

  function animStep() {
    y += dir * 4;
    if (y >= window.innerHeight) { dir = -1; passes++; }
    if (y <= 0 && passes > 0)   { dir =  1; passes++; }
    scanLine.style.top = y + 'px';
    if (passes >= 2) {
      scanLine.style.opacity = '0';
      scanAnimActive = false;
      return;
    }
    requestAnimationFrame(animStep);
  }
  requestAnimationFrame(animStep);
}

// ═══════════════════════════════════════════════════════════════════════════════
// TRACKER LIST UI
// ═══════════════════════════════════════════════════════════════════════════════
function updateTrackerListUI() {
  trackerListEl.innerHTML = '';
  trackers.forEach(t => {
    const el = document.createElement('div');
    el.className = 'tracker-entry ' + (t.isNew ? 'new' : 'known');
    el.textContent = `ID #${t.id}`;
    trackerListEl.appendChild(el);
  });
}

// ═══════════════════════════════════════════════════════════════════════════════
// FACE RE-ID RECONCILIATION
// ═══════════════════════════════════════════════════════════════════════════════
let prevFaceCount = 0;

function reconcileTrackersWithReID(faceLandmarksArray) {
  const faceCount = faceLandmarksArray.length;

  // Extract descriptors for each face in the current frame
  const currentDescriptors = faceLandmarksArray.map(lm => extractFaceDescriptor(lm));

  // Match each face to known faces or create new
  const newTrackers = [];
  const matchedKnown = new Set();

  for (let i = 0; i < faceCount; i++) {
    const desc = currentDescriptors[i];
    let bestMatch = null;
    let bestDist = Infinity;

    // Search known faces for a match
    for (let k = 0; k < knownFaces.length; k++) {
      if (matchedKnown.has(k)) continue;
      const dist = descriptorDistance(desc, knownFaces[k].descriptor);
      if (dist < bestDist) {
        bestDist = dist;
        bestMatch = k;
      }
    }

    if (bestMatch !== null && bestDist < RE_ID_THRESHOLD) {
      // Re-identified!
      matchedKnown.add(bestMatch);
      const known = knownFaces[bestMatch];
      // Update descriptor with exponential moving average
      if (desc) {
        known.descriptor = known.descriptor.map((v, j) =>
          v * 0.85 + (desc[j] || 0) * 0.15
        );
      }
      known.lastSeen = performance.now();
      newTrackers.push({ id: known.id, color: COLOR_KNOWN, isNew: false, knownIdx: bestMatch });
    } else {
      // New face!
      totalDetected++;
      const id = nextTrackerId++;
      const newEntry = {
        id, descriptor: desc, lastSeen: performance.now(), color: COLOR_KNOWN
      };
      knownFaces.push(newEntry);
      newTrackers.push({ id, color: COLOR_NEW, isNew: true, knownIdx: knownFaces.length - 1 });
      triggerScanAnimation();
      playBeep(1200 + i * 200, 0.14, 0.25);

      // Transition to known after 2s
      const tracker = newTrackers[newTrackers.length - 1];
      setTimeout(() => {
        tracker.isNew = false;
        tracker.color = COLOR_KNOWN;
        updateTrackerListUI();
      }, 2000);

      totalCountEl.textContent = totalDetected;
    }
  }

  // Cleanup: remove known faces not seen for 60 seconds
  const now = performance.now();
  knownFaces = knownFaces.filter(kf => now - kf.lastSeen < 60000);

  trackers = newTrackers;
  prevFaceCount = faceCount;
  updateTrackerListUI();
}

// ═══════════════════════════════════════════════════════════════════════════════
// WEBGL RENDERING — Dot Projector
// ═══════════════════════════════════════════════════════════════════════════════
function renderDotProjector(allFacePoints, canvasW, canvasH, time) {
  gl.viewport(0, 0, canvasW, canvasH);
  gl.clearColor(0, 0, 0, 1); // dark background
  gl.clear(gl.COLOR_BUFFER_BIT);

  if (allFacePoints.length === 0) return;

  // Merge all face point data into one buffer
  let totalCount = 0;
  for (const fp of allFacePoints) totalCount += fp.count;

  const merged = new Float32Array(totalCount * 3);
  let offset = 0;
  for (const fp of allFacePoints) {
    merged.set(fp.data.subarray(0, fp.count * 3), offset);
    offset += fp.count * 3;
  }

  gl.bindBuffer(gl.ARRAY_BUFFER, pointBuffer);
  gl.bufferData(gl.ARRAY_BUFFER, merged, gl.DYNAMIC_DRAW);
  gl.vertexAttribPointer(aPosition, 3, gl.FLOAT, false, 0, 0);

  gl.uniform2f(uResolution, canvasW, canvasH);

  // Adaptive point scale based on canvas resolution
  const scale = Math.min(canvasW, canvasH) / 320;
  gl.uniform1f(uPointScale, scale * 2.5);

  gl.uniform1f(uScanY, scanlineActive ? scanlineY : -1.0);
  gl.uniform1f(uTime, time * 0.001);
  gl.uniform1f(uColorMode, 0.0); // 0 = cyan, change to 1 for violet

  gl.drawArrays(gl.POINTS, 0, totalCount);

  activePointCount = totalCount;
}

// ═══════════════════════════════════════════════════════════════════════════════
// HUD 2D OVERLAY — draw face ID labels
// ═══════════════════════════════════════════════════════════════════════════════
function renderHUD(faceLandmarksArray, canvasW, canvasH) {
  hudCtx.clearRect(0, 0, canvasW, canvasH);

  for (let i = 0; i < faceLandmarksArray.length; i++) {
    const landmarks = faceLandmarksArray[i];
    const tracker = trackers[i] || { id: '?', color: COLOR_KNOWN, isNew: false };
    const nose = landmarks[1];
    if (!nose) continue;

    // Mirror X to match front camera
    const nx = (1.0 - nose.x) * canvasW;
    const ny = nose.y * canvasH;

    hudCtx.globalAlpha = 1;
    hudCtx.font = 'bold 14px Courier New';
    hudCtx.fillStyle = tracker.isNew ? COLOR_NEW : COLOR_KNOWN;
    const label = tracker.isNew ? `⚡ NEW #${tracker.id}` : `✦ ID #${tracker.id}`;
    hudCtx.shadowColor = tracker.isNew ? COLOR_NEW : COLOR_KNOWN;
    hudCtx.shadowBlur = 12;
    hudCtx.fillText(label, nx - 30, ny - 40);
    hudCtx.shadowBlur = 0;

    // Draw bounding box
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    for (const lm of landmarks) {
      const lx = (1.0 - lm.x) * canvasW;
      const ly = lm.y * canvasH;
      if (lx < minX) minX = lx;
      if (lx > maxX) maxX = lx;
      if (ly < minY) minY = ly;
      if (ly > maxY) maxY = ly;
    }
    const pad = 15;
    hudCtx.strokeStyle = tracker.isNew ? 'rgba(255,204,0,0.4)' : 'rgba(0,255,231,0.25)';
    hudCtx.lineWidth = 1;
    hudCtx.setLineDash([6, 4]);
    hudCtx.strokeRect(minX - pad, minY - pad, maxX - minX + pad * 2, maxY - minY + pad * 2);
    hudCtx.setLineDash([]);
  }
}

// ═══════════════════════════════════════════════════════════════════════════════
// MEDIAPIPE RESULTS CALLBACK
// ═══════════════════════════════════════════════════════════════════════════════
let _lastResultsTs = 0;

function onResults(results) {
  const now = performance.now();

  // FPS calculation
  frameCount++;
  if (now - fpsTimer >= 1000) {
    currentFPS = Math.round(frameCount * 1000 / (now - fpsTimer));
    fpsEl.textContent = currentFPS;
    frameCount = 0;
    fpsTimer = now;
  }

  // Get actual video dimensions for reference
  const vidW = results.image.videoWidth  || results.image.width  || video.videoWidth  || 1280;
  const vidH = results.image.videoHeight || results.image.height || video.videoHeight || 720;

  // Set canvas sizes to screen display size (HD render)
  const displayW = glCanvas.clientWidth  || window.innerWidth;
  const displayH = glCanvas.clientHeight || window.innerHeight;

  if (glCanvas.width !== displayW || glCanvas.height !== displayH) {
    glCanvas.width = displayW;
    glCanvas.height = displayH;
    hudCanvas.width = displayW;
    hudCanvas.height = displayH;
  }

  // Update resolution display
  resEl.textContent = `${vidW}×${vidH}`;

  // Update scanline
  updateScanline();

  if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
    const faces = results.multiFaceLandmarks;
    const faceCount = faces.length;

    // Smooth landmarks with lerp
    const smoothedFaces = faces.map((lm, i) => {
      const smoothed = lerpLandmarks(lm, prevLandmarksSmoothed[i]);
      return smoothed;
    });
    prevLandmarksSmoothed = smoothedFaces;

    // Re-ID reconciliation
    reconcileTrackersWithReID(smoothedFaces);
    currentCountEl.textContent = faceCount;

    // Generate dense point clouds for each face
    const allPoints = [];
    for (const lm of smoothedFaces) {
      // Mirror X coordinates for front camera
      const mirrored = lm.map(p => ({ x: 1.0 - p.x, y: p.y, z: p.z || 0 }));
      const denseResult = generateDensePointsFromTriangles(mirrored);
      allPoints.push(denseResult);
    }

    // Render dot projector via WebGL
    renderDotProjector(allPoints, displayW, displayH, now);

    // Update point count display
    pointCountEl.textContent = activePointCount.toLocaleString();

    // Render 2D HUD labels
    renderHUD(smoothedFaces, displayW, displayH);

    statusMsg.textContent = `▶ ${faceCount} face(s) — ${activePointCount.toLocaleString()} 3D points`;
  } else {
    // No faces
    prevLandmarksSmoothed = [];
    if (trackers.length > 0) {
      trackers = [];
      prevFaceCount = 0;
      updateTrackerListUI();
    }
    currentCountEl.textContent = '0';
    pointCountEl.textContent = '0';

    // Clear WebGL canvas to black
    gl.viewport(0, 0, displayW, displayH);
    gl.clearColor(0, 0, 0, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);

    // Clear HUD
    hudCtx.clearRect(0, 0, displayW, displayH);

    statusMsg.textContent = '◉ TrueDepth Scanning...';
  }
}

// ═══════════════════════════════════════════════════════════════════════════════
// MEDIAPIPE FACEMESH INIT
// ═══════════════════════════════════════════════════════════════════════════════
async function initFaceMesh() {
  setStatus('2. Đang tải mô hình MediaPipe FaceMesh...', 'loading');
  updateLoadingStep('Đang tải mô hình nhận diện khuôn mặt HD...');

  faceMesh = new FaceMesh({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
  });

  faceMesh.setOptions({
    maxNumFaces:            5,
    refineLandmarks:        true, // enabled for 478 landmarks (iris tracking)
    minDetectionConfidence: 0.5,
    minTrackingConfidence:  0.5,
  });

  faceMesh.onResults(onResults);

  // Warm-up
  try {
    const warmup = document.createElement('canvas');
    warmup.width = 320; warmup.height = 240;
    await faceMesh.send({ image: warmup });
  } catch(e) {}
}

// ═══════════════════════════════════════════════════════════════════════════════
// CAMERA SETUP — HD Pipeline
// ═══════════════════════════════════════════════════════════════════════════════
function updateLoadingStep(text) {
  if (loadingStepEl) loadingStepEl.textContent = text;
}

async function startCamera() {
  hideError();

  if (mediapipeCamera) { try { mediapipeCamera.stop(); } catch(e) {} }
  if (currentStream)   { currentStream.getTracks().forEach(t => t.stop()); }

  setStatus('1. Đang khởi tạo camera HD...', 'loading');
  updateLoadingStep('Đang xin quyền truy cập camera HD...');

  // HD constraints: ideal 1280x720
  const constraintSets = [
    {
      video: {
        facingMode: useFrontCamera ? 'user' : 'environment',
        width:  { ideal: 1280 },
        height: { ideal: 720 },
      },
      audio: false,
    },
    {
      video: {
        facingMode: useFrontCamera ? 'user' : 'environment',
        width:  { ideal: 960 },
        height: { ideal: 540 },
      },
      audio: false,
    },
    {
      video: { facingMode: useFrontCamera ? 'user' : 'environment' },
      audio: false,
    },
    { video: true, audio: false },
  ];

  let stream = null;
  let lastErr = null;

  for (const constraints of constraintSets) {
    try {
      stream = await navigator.mediaDevices.getUserMedia(constraints);
      break;
    } catch(err) {
      lastErr = err;
    }
  }

  if (!stream) {
    let detail = lastErr ? lastErr.message : 'Không rõ nguyên nhân.';
    if (lastErr && lastErr.name === 'NotAllowedError') {
      detail = 'Quyền truy cập camera bị từ chối. Vui lòng cấp quyền camera trong cài đặt trình duyệt rồi tải lại trang.';
    } else if (lastErr && lastErr.name === 'NotFoundError') {
      detail = 'Không tìm thấy camera nào trên thiết bị này.';
    } else if (lastErr && lastErr.name === 'NotReadableError') {
      detail = 'Camera đang được ứng dụng khác sử dụng. Vui lòng đóng các ứng dụng khác rồi thử lại.';
    } else if (lastErr && lastErr.name === 'OverconstrainedError') {
      detail = 'Camera không hỗ trợ cấu hình yêu cầu: ' + (lastErr.constraint || '') + '.';
    }
    showError('Không thể truy cập camera', detail);
    return;
  }

  currentStream = stream;
  video.srcObject = stream;
  video.style.transform = useFrontCamera ? 'scaleX(-1)' : 'scaleX(1)';

  await new Promise((resolve, reject) => {
    const timer = setTimeout(() => reject(new Error('Video metadata timeout')), 10000);
    video.onloadedmetadata = () => {
      clearTimeout(timer);
      resolve();
    };
  });

  try { await video.play(); } catch(e) {}

  const actualW = video.videoWidth  || 1280;
  const actualH = video.videoHeight || 720;
  console.log(`[TrueDepth] Camera resolution: ${actualW}×${actualH}`);
  resEl.textContent = `${actualW}×${actualH}`;

  updateLoadingStep('Camera HD sẵn sàng. Đang tải AI model...');

  if (!faceMesh) {
    await initFaceMesh();
  }

  setStatus('3. Camera HD sẵn sàng, đang quét...', 'loading');
  updateLoadingStep('Đang khởi chạy TrueDepth 3D Scanner...');

  // MediaPipe Camera helper — pump frames
  // AI processes at reduced resolution for performance,
  // but WebGL renders at full display resolution
  const aiWidth  = Math.min(actualW, 640);  // downscale for AI
  const aiHeight = Math.round(aiWidth * actualH / actualW);

  mediapipeCamera = new Camera(video, {
    onFrame: async () => {
      if (faceMesh && video.readyState >= 2) {
        try {
          await faceMesh.send({ image: video });
        } catch(e) {
          console.warn('[TrueDepth] faceMesh.send error:', e);
        }
      }
    },
    width:  aiWidth,
    height: aiHeight,
  });

  try {
    await mediapipeCamera.start();
  } catch(e) {
    showError('Không thể khởi động MediaPipe Camera', e.message || String(e));
    return;
  }

  loadingOverlay.classList.add('hidden');
  setStatus('TrueDepth 3D Scanner — Active', 'ok');
  setTimeout(() => hideStatusBar(), 4000);
}

// ═══════════════════════════════════════════════════════════════════════════════
// SWITCH CAMERA
// ═══════════════════════════════════════════════════════════════════════════════
switchCamBtn.addEventListener('click', async () => {
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  useFrontCamera = !useFrontCamera;
  loadingOverlay.classList.remove('hidden');
  statusBar.classList.remove('hidden');
  prevLandmarksSmoothed = [];
  await startCamera();
});

// ═══════════════════════════════════════════════════════════════════════════════
// RETRY BUTTON
// ═══════════════════════════════════════════════════════════════════════════════
retryBtn.addEventListener('click', async () => {
  loadingOverlay.classList.remove('hidden');
  statusBar.classList.remove('hidden');
  await startCamera();
});

// ═══════════════════════════════════════════════════════════════════════════════
// BOOTSTRAP
// ═══════════════════════════════════════════════════════════════════════════════
(async () => {
  try {
    TESSELATION = window.FACEMESH_TESSELATION || [];
    await startCamera();
  } catch(err) {
    showError('Lỗi khởi động', err.message || String(err));
  }
})();
</script>
